<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>JacobFraser.uk</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #080812;
      color: white;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      cursor: crosshair;
    }

    .glow {
      position: fixed;
      width: 420px;
      height: 420px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255, 60, 172, 0.28), transparent 65%);
      pointer-events: none;
      transform: translate(-50%, -50%);
      z-index: 1;
    }

    .stars {
      position: fixed;
      inset: 0;
      background-image:
        radial-gradient(white 1px, transparent 1px),
        radial-gradient(rgba(255,255,255,0.5) 1px, transparent 1px);
      background-size: 80px 80px, 140px 140px;
      animation: drift 18s linear infinite;
      opacity: 0.45;
    }

    @keyframes drift {
      from { transform: translateY(0); }
      to { transform: translateY(80px); }
    }

    .orb {
      position: fixed;
      width: 220px;
      height: 220px;
      border-radius: 50%;
      filter: blur(20px);
      opacity: 0.45;
      animation: float 8s ease-in-out infinite;
    }

    .orb.one {
      top: 10%;
      left: 12%;
      background: #ff3cac;
    }

    .orb.two {
      bottom: 12%;
      right: 14%;
      background: #2b86c5;
      animation-delay: 2s;
    }

    .orb.three {
      top: 55%;
      left: 65%;
      background: #00c9a7;
      animation-delay: 4s;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0) scale(1); }
      50% { transform: translateY(-35px) scale(1.08); }
    }

    .screen {
      position: relative;
      z-index: 2;
      width: min(90vw, 620px);
      padding: 3rem 2rem;
      text-align: center;
      border: 2px solid rgba(255,255,255,0.14);
      border-radius: 28px;
      background: rgba(10, 10, 25, 0.72);
      backdrop-filter: blur(18px);
      box-shadow:
        0 0 40px rgba(255, 60, 172, 0.18),
        inset 0 0 30px rgba(255,255,255,0.04);
    }

    .badge {
      display: inline-block;
      margin-bottom: 1.4rem;
      padding: 0.45rem 0.9rem;
      border-radius: 999px;
      border: 1px solid rgba(255,255,255,0.2);
      color: #b9fbc0;
      font-size: 0.8rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
    }

    h1 {
      font-size: clamp(3rem, 10vw, 5.8rem);
      line-height: 0.9;
      letter-spacing: -0.08em;
      margin-bottom: 1rem;
      background: linear-gradient(90deg, #ff3cac, #784ba0, #2b86c5, #00c9a7, #92fe9d);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: pulse 3s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { filter: drop-shadow(0 0 8px rgba(255, 60, 172, 0.25)); }
      50% { filter: drop-shadow(0 0 20px rgba(43, 134, 197, 0.45)); }
    }

    p {
      color: rgba(255,255,255,0.72);
      font-size: 1.1rem;
      margin-bottom: 2rem;
    }

    .btn {
      display: inline-block;
      padding: 1rem 1.8rem;
      border-radius: 16px;
      color: white;
      text-decoration: none;
      font-weight: 800;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      background: linear-gradient(90deg, #ff3cac, #784ba0, #2b86c5);
      box-shadow: 0 0 25px rgba(255, 60, 172, 0.35);
      transition: 0.2s ease;
    }

    .btn:hover {
      transform: translateY(-4px) scale(1.04);
      box-shadow: 0 0 45px rgba(43, 134, 197, 0.55);
    }

    .hint {
      margin-top: 1.8rem;
      font-size: 0.8rem;
      color: rgba(255,255,255,0.38);
    }

    .spark {
      position: fixed;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: white;
      pointer-events: none;
      animation: pop 700ms ease-out forwards;
      z-index: 5;
    }

    @keyframes pop {
      from {
        transform: scale(1);
        opacity: 1;
      }
      to {
        transform: scale(0) translateY(-60px);
        opacity: 0;
      }
    }
  </style>
</head>

<body>
  <div class="stars"></div>
  <div class="glow" id="glow"></div>

  <div class="orb one"></div>
  <div class="orb two"></div>
  <div class="orb three"></div>

  <main class="screen">
    <div class="badge">Player One</div>

    <h1>Jacob<br>Fraser</h1>

    <p>Press start.</p>

    <a href="mailto:&#109;&#101;&#64;&#106;&#97;&#99;&#111;&#98;&#102;&#114;&#97;&#115;&#101;&#114;&#46;&#117;&#107;" class="btn">
      Start
    </a>

    <div class="hint">click anywhere ✦</div>
  </main>

  <script>
    const glow = document.getElementById("glow");

    document.addEventListener("mousemove", (e) => {
      glow.style.left = e.clientX + "px";
      glow.style.top = e.clientY + "px";
    });

    document.addEventListener("click", (e) => {
      for (let i = 0; i < 8; i++) {
        const spark = document.createElement("div");
        spark.className = "spark";

        spark.style.left = e.clientX + (Math.random() * 80 - 40) + "px";
        spark.style.top = e.clientY + (Math.random() * 80 - 40) + "px";

        document.body.appendChild(spark);

        setTimeout(() => spark.remove(), 700);
      }
    });
  </script>
</body>
</html>
